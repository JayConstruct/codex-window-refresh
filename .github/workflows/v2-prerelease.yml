name: Build and publish v2 prerelease

on:
  push:
    branches: [main]
    paths: [release/v2-version.txt, .github/workflows/v2-prerelease.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-prerelease
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: version
        run: printf 'version=%s\n' "$(python3 scripts/package-v2.py --check)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: golang:1.26.1-bookworm
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev binutils make python3 python3-yaml nodejs libcurl4-openssl-dev libjson-c5
      - name: Test native bridge, backend and update script
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          make check race v2-smoke build installer-check panel-check
      - name: Package independent backend
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/package-v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v2-linux-*
          path: dist
          merge-multiple: true
      - name: Verify and publish v2 release
        run: |
          for arch in amd64 arm64; do
            test -f "dist/codex-window-refresh-v2_${VERSION}_linux_${arch}.tar.gz"
            test -f "dist/codex-window-refresh-v2_${VERSION}_linux_${arch}.tar.gz.sha256"
          done
          cat dist/*.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; leave published assets unchanged.'
            exit 0
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Codex Window Refresh v2 $VERSION" \
            --notes-file "docs/releases/$VERSION.md" --prerelease --latest=false

  verify-release:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download published assets and test script update
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 python3-yaml libcurl4 libjson-c5
          mkdir -p published bin
          asset="codex-window-refresh-v2_${VERSION}_linux_${ARCH}.tar.gz"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          curl -fSL --retry 5 --retry-all-errors "$base/$asset" -o "published/$asset"
          curl -fSL --retry 5 --retry-all-errors "$base/SHA256SUMS" -o published/SHA256SUMS
          (cd published && grep "  $asset\$" SHA256SUMS | sha256sum -c -)
          tar -xzf "published/$asset" -C published
          package="published/${asset%.tar.gz}"
          python3 -c 'import json,sys,os; assert json.load(open(sys.argv[1]))["commit"] == os.environ["GITHUB_SHA"]' "$package/BUILD-INFO.json"
          cp "$package/window-refreshd" "$package/codex-window-refresh-v2-bridge.so" bin/
          export CWR_V2_TEST_ARCHIVE="$GITHUB_WORKSPACE/published/$asset"
          export CWR_V2_TEST_SUMS="$GITHUB_WORKSPACE/published/SHA256SUMS"
          python3 native/bridge/tests/smoke.py
