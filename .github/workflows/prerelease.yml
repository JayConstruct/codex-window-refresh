name: Build and publish prerelease

on:
  push:
    branches: [main]
    paths: [release/version.txt, .github/workflows/prerelease.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(cat release/version.txt)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          test -f "docs/releases/$version.md"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: golang:1.26.1-bookworm
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev binutils make python3 python3-yaml nodejs
      - name: Test, load, and build native binaries
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          make check race native-smoke build installer-check panel-check
      - name: Package disabled policy and installation guide
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/package-release.py --version "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Verify both packages and checksums
        run: |
          test -f "dist/codex-window-refresh_${VERSION}_linux_amd64.tar.gz"
          test -f "dist/codex-window-refresh_${VERSION}_linux_arm64.tar.gz"
          test -f "dist/codex-window-refresh_${VERSION}_linux_amd64.tar.gz.sha256"
          test -f "dist/codex-window-refresh_${VERSION}_linux_arm64.tar.gz.sha256"
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
      - name: Publish release candidate
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'This release already exists; tests passed and existing assets remain unchanged.'
            exit 0
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Codex Window Refresh $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --prerelease --latest=false
